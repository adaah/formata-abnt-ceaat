<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formata ABNT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: trilho de passos | formulário | prévia das páginas (no celular: topo com passos, formulário, prévia em tela cheia) */
  --forest:#1d4a36; --forest-2:#143827; --lime:#c9f23d; --lime-soft:#e7f7ad;
  --bg:#e8eedd; --card:#ffffff; --ink:#13271d; --muted:#586b60; --line:#d2dbc6;
  --bad:#a63a26; --bad-bg:#fbe9e3; --soft:#8a5a00; --soft-bg:#fff3cf;
  --display:"Outfit","Trebuchet MS",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; --r-s:13px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px;border-radius:8px}
.hero :focus-visible,.rail :focus-visible,.prev :focus-visible{outline-color:var(--lime)}
.ic{display:inline-flex;width:20px;height:20px;flex:none}.ic svg{width:100%;height:100%}

.app{display:grid;grid-template-columns:236px minmax(0,1fr) minmax(360px,40%);height:100%}
.rail{background:var(--forest);color:#eef4e4;display:flex;flex-direction:column;gap:22px;padding:22px 16px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--lime);color:var(--forest);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.brand b{font:700 21px/1 var(--display);letter-spacing:-.01em;display:block}
.brand small{font-size:12.5px;opacity:.75}
.brand .grow{flex:1}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;text-decoration:none;font-weight:500;color:#dfe9d6}
#nav a:hover{background:rgba(255,255,255,.08)}
#nav a.on{background:var(--lime);color:var(--forest-2);font-weight:700}
#nav a span:nth-child(2){flex:1}
#nav .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.45}
#nav a.done .dot{background:var(--lime);border-color:var(--lime);opacity:1}
#nav a.on.done .dot{background:var(--forest);border-color:var(--forest)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

#work{overflow:auto;padding:28px clamp(16px,3vw,36px) 0;display:flex;flex-direction:column;gap:18px}
#step{display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
#banner,.stepnav{max-width:760px;width:100%;margin:0 auto}
.stepnav{display:flex;justify-content:space-between;gap:12px;padding:8px 0 28px;margin-top:auto}
.step-h{display:flex;flex-direction:column;gap:8px}
.step-h h1{font-size:clamp(26px,3.2vw,34px);letter-spacing:-.02em}
.step-h p{color:var(--muted);max-width:60ch}
.card{background:var(--card);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:19px;display:flex;align-items:center;gap:8px}
.card h2 .count{font:600 13px var(--body);background:var(--lime-soft);border-radius:99px;padding:2px 10px}
.twohead{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.twohead h2{font-size:21px;display:flex;align-items:center;gap:8px}.twohead p{color:var(--muted)}

.hero{background:var(--forest);color:#f2f7ea;border-radius:26px;padding:clamp(22px,4vw,34px);display:flex;flex-direction:column;gap:14px;
  background-image:radial-gradient(circle at 100% 0,rgba(201,242,61,.2),transparent 46%)}
.hero h1{font-size:clamp(25px,3.6vw,36px);letter-spacing:-.02em}
.hero p{max-width:58ch;color:#d6e2cd}
.eyebrow{font:600 12.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--lime)!important}
.eyebrow.dark{color:var(--forest)!important}
.gen-note{min-height:1.5em;color:var(--lime)!important;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:var(--forest);border-radius:26px;padding:18px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#e3ecd9;font-size:13px;font-weight:500;text-align:center;line-height:1.2}
.tile-ic{width:52px;height:52px;border-radius:15px;background:var(--lime);color:var(--forest);display:grid;place-items:center}
.tile-ic svg{width:26px;height:26px}
.tile:hover .tile-ic{transform:translateY(-2px)}
.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 22px}
.rules li{display:flex;gap:9px;align-items:flex-start;font-size:15px}
.rules .ic{color:var(--forest);background:var(--lime-soft);border-radius:7px;padding:3px;margin-top:1px}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.end{justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 17px;font-weight:600;cursor:pointer;text-decoration:none;min-height:46px}
.btn:hover{border-color:var(--forest)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:14.5px;border-radius:12px}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--forest-2)}
.btn.lime:hover{background:#d6fb55}
.btn.forest{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.forest:hover{background:var(--forest-2)}
.btn.ghost-dark{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn.ghost-dark:hover{border-color:var(--lime)}
.btn.add{border-style:dashed;background:transparent;width:100%}
.big-btn{font-size:17px;padding:14px 24px}
.mini{width:38px;height:38px;border-radius:11px;border:0;background:#eef2e6;display:inline-grid;place-items:center;cursor:pointer;flex:none;color:var(--forest)}
.mini:hover{background:var(--lime-soft)}.mini:disabled{opacity:.35;cursor:default}
.mini svg{width:19px;height:19px}
.ibtn{width:30px;height:30px;border-radius:50%;border:0;background:var(--lime);color:var(--forest-2);display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0;vertical-align:middle}
.ibtn svg{width:20px;height:20px}.ibtn:hover{background:var(--forest);color:var(--lime)}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lab{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
input[type=text],input[type=date],input:not([type]),select,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r-s);padding:11px 13px;background:#fbfcf8;min-height:46px}
textarea{resize:vertical;line-height:1.5;display:block}
textarea.big{min-height:170px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--forest);box-shadow:0 0 0 3px var(--lime-soft);background:#fff}
input[type=file]{padding:9px;border:1.5px dashed var(--line);border-radius:var(--r-s);background:#fbfcf8;width:100%}
::placeholder{color:#8b9a8f}
.hint{font-size:14px;color:var(--muted)}
.meter{font-size:13.5px;color:var(--muted);min-height:1.3em}
.meter.good{color:var(--forest);font-weight:600}.meter.low{color:var(--soft);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid2 .wide{grid-column:1/-1}
.ck{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer;min-height:36px}
.ck input{width:20px;height:20px;accent-color:var(--forest);flex:none}
.off{display:none}
.logo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo-row img{height:56px;max-width:120px;object-fit:contain;border-radius:8px;background:#fff;border:1.5px solid var(--line);padding:3px}.logo-row input{flex:1;min-width:180px}

.sec{gap:10px}
.sec-h{display:flex;align-items:center;gap:10px}
.badge{min-width:38px;height:38px;border-radius:12px;background:var(--forest);color:var(--lime);font:700 17px var(--display);display:grid;place-items:center;flex:none}
.sec-t{font:600 18px var(--display)!important;border-color:transparent!important;background:transparent!important;padding:6px 8px!important;min-width:0}
.sec-t:hover{border-color:var(--line)!important}.sec-t:focus{border-color:var(--forest)!important;background:#fff!important}
.sec-f{display:flex;align-items:center;gap:6px}.grow{flex:1}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tools button{flex:none;border:0;background:#eef2e6;border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--forest-2);min-height:36px}
.tools button:hover{background:var(--lime)}
.media{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.media li{display:flex;align-items:center;gap:12px;background:#f4f7ee;border-radius:14px;padding:8px}
.media img,.tabic{width:56px;height:44px;border-radius:9px;object-fit:cover;background:#fff;flex:none}
.tabic{display:grid;place-items:center;color:var(--forest)}.tabic svg{width:22px;height:22px}
.media div{flex:1;min-width:0;display:flex;flex-direction:column}.media b{overflow-wrap:anywhere;font-size:15px}.media span{font-size:13px;color:var(--muted)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:38px}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.refprev{background:var(--forest);color:#f2f7ea;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.refprev .lab{color:var(--lime);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.refprev p{overflow-wrap:anywhere}.muted{opacity:.7}
.reflist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.reflist li{background:#f4f7ee;border-radius:16px;padding:13px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px}
.reftext{overflow-wrap:anywhere}
.cites{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.cite{border:0;background:var(--lime-soft);color:var(--forest-2);border-radius:99px;padding:5px 11px;font-size:13.5px;font-weight:600;cursor:pointer}
.cite:hover{background:var(--lime)}
.acts{grid-column:2;grid-row:1/span 2;display:flex;gap:6px;align-items:flex-start}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.checks li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:13px;background:#f4f7ee;font-size:15px}
.checks li span:nth-child(2){flex:1;overflow-wrap:anywhere}
.checks .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--lime);color:var(--forest-2)}
.checks .st svg{width:16px;height:16px}
.checks .bad{background:var(--bad-bg)}.checks .bad .st{background:var(--bad);color:#fff}
.checks .soft{background:var(--soft-bg)}.checks .soft .st{background:var(--soft);color:#fff}
.checks a{font-weight:700;color:var(--forest);flex:none}
.banner{background:var(--lime);color:var(--forest-2);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.prev{background:var(--forest-2);display:flex;flex-direction:column;min-height:0}
.prev-h{display:flex;align-items:center;gap:10px;padding:16px 20px;color:#eaf2e0}
.prev-h b{font:600 17px var(--display)}.prev-h span{font-size:13.5px;opacity:.75;flex:1}
#pages{overflow:auto;padding:4px 20px 28px;display:flex;flex-direction:column;gap:16px;flex:1}
.pg{background:#fff;aspect-ratio:595.28/841.89;border-radius:6px;box-shadow:0 6px 22px rgba(0,0,0,.28);flex:none;overflow:hidden}
.pg-svg{display:block;width:100%;height:100%}
.pg-svg text{white-space:pre;font-kerning:none;fill:#000}

.sheet{position:fixed;inset:0;background:rgba(14,36,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.sheet[hidden]{display:none}
.sheet-card{background:#fff;border-radius:26px;padding:26px;width:min(560px,100%);max-height:min(88vh,100%);overflow:auto;position:relative}
.sheet.wide .sheet-card{width:min(680px,100%)}.sheet.small .sheet-card{width:min(430px,100%)}
#sheetBody{display:flex;flex-direction:column;gap:14px}
#sheetBody h2{font-size:23px;padding-right:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sheetBody h3{font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--forest);margin-top:6px}
.sheet-x{position:absolute;top:18px;right:18px}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.how li::marker{font-weight:700;color:var(--forest)}
.must{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.must li{display:flex;align-items:center;gap:6px;background:var(--lime);color:var(--forest-2);font-weight:700;border-radius:99px;padding:6px 13px 6px 9px;font-size:14.5px}
.must svg{width:16px;height:16px;flex:none}
.ex{margin:0;background:var(--forest);border-radius:18px;padding:8px 16px;color:#f0f6e8}
.ex div{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.13)}
.ex div:last-child{border-bottom:0}
.ex dt{color:var(--lime);font-weight:700;font-size:14px}
.ex dd{margin:0;overflow-wrap:anywhere;font-size:15px}
.ex.found{background:#f4f7ee;color:var(--ink)}.ex.found div{border-color:var(--line)}.ex.found dt{color:var(--forest)}
.err{color:var(--bad);font-weight:600;min-height:0}.err:empty{display:none}
.figprev img{max-width:100%;max-height:170px;border-radius:10px;margin-top:8px;display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.only-mobile{display:none!important}
body.locked{overflow:hidden}

@media (max-width:999px){
  html,body{height:auto}
  .app{display:block}
  .rail{position:sticky;top:0;z-index:20;padding:12px 16px 10px;gap:10px;overflow:visible}
  .logo{width:36px;height:36px;border-radius:11px}.logo svg{width:20px;height:20px}
  .brand b{font-size:18px}.brand small{display:none}
  #nav{flex-direction:row;overflow-x:auto;gap:6px;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #nav a{flex:none;padding:8px 12px;font-size:14.5px;background:rgba(255,255,255,.08)}
  #nav a .ic{display:none}#nav .dot{width:7px;height:7px}
  .rail-foot{display:none}
  #work{overflow:visible;padding:18px 16px 0}
  .stepnav{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 14px}
  .stepnav .btn{flex:1}
  .prev{position:fixed;inset:0;z-index:40;display:none}
  body.show-prev .prev{display:flex}body.show-prev{overflow:hidden}
  #pages{padding:4px 14px 24px}
  .only-mobile{display:inline-flex!important}
  .only-desktop{display:none!important}
  .sheet{align-items:flex-end;padding:0}
  .sheet-card{border-radius:26px 26px 0 0;width:100%!important;max-height:90vh;padding:22px 18px 26px}
  .card{padding:18px 16px}
}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  .tiles{gap:6px;padding:14px 10px}.tile{font-size:11.5px}.tile-ic{width:46px;height:46px}
  .hero .btn{width:100%}
  .reflist li{grid-template-columns:1fr}.acts{grid-column:1;grid-row:auto;justify-content:flex-end}
  .ex div{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="rail">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 11h5M10 14.500h5M10 18h3" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/></svg></span>
      <div><b>Formata</b><small>TCC nas normas ABNT</small></div>
      <span class="grow"></span>
      <button type="button" class="btn sm lime only-mobile" data-a="preview">Prévia</button>
    </div>
    <nav id="nav" aria-label="Etapas"></nav>
    <div class="rail-foot only-desktop"><button type="button" class="btn lime" data-a="pdf">Baixar PDF</button></div>
  </header>
  <main id="work">
    <div id="banner"></div>
    <div id="step"></div>
    <div id="stepnav" class="stepnav"></div>
  </main>
  <aside class="prev" id="prev" aria-label="Prévia do PDF">
    <div class="prev-h"><b>Prévia do PDF</b><span id="pcount"></span><button type="button" class="mini only-mobile" data-a="hidePreview" aria-label="Fechar prévia"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div id="pages"></div>
  </aside>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><button type="button" class="mini sheet-x" data-a="close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div id="sheetBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="fonts.js"></script>
<script src="engine.js"></script>
<script src="guide.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
